name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify and build
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          go test -race ./...
          go vet ./...
          python3 scripts/test_install.py
          mkdir dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              suffix=""
              [[ "$os" != windows ]] || suffix=".exe"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/maolv_${VERSION}_${os}_${arch}${suffix}" ./cmd/maolv
            done
          done
          (cd dist && sha256sum maolv_* > checksums.txt && sha256sum -c checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --verify-tag --title "$VERSION" --generate-notes
